name: image_dedup
description: "A Flutter Windows project for image duplicate detection and analysis."
# 下面的行可以防止意外地将包发布到 pub.dev，使用"flutter pub publish"。这是私有包的首选。
# 如果你想发布到 pub.dev，那么删除这一行
publish_to: 'none'

# 下面定义应用程序的版本和构建号。
# 版本号是三个用点分隔的数字，比如1.2.43，后面跟着一个可选的以+分隔的构建号。
# 在flutter中版本和建造者编号都可能被覆盖
# 通过分别指定--build-name 和 --build-number来构建。
# 在Android中，build-name用作versionName，而build-number用作versionCode。
# 阅读更多关于Android版本控制的信息，请访问：https://developer.android.com/studio/publish/versioning
# 在iOS中，build-name被用作CFBundleShortVersionString，而build-number被用作CFBundleVersion。
# 阅读更多关于iOS版本控制的信息：https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# 在Windows中，build-name用作产品和文件版本的主要、次要和补丁部分，而build-number用作构建后缀。
version: 1.0.0+1

environment:
  sdk: ^3.6.2

# 依赖项
# 指定了您的包工作所需的其他包。
# 自动将软件包依赖项升级到最新版本，考虑运行"flutter pub upgrade—major-versions"。
# 另外,可以通过将下面的版本号更改为来手动更新依赖项pub.dev上提供的最新版本。查看哪些依赖项具有更新的版本可用，运行"flutter pub obsolete"。
dependencies:
  flutter:
    sdk: flutter
  
  path_provider: ^2.1.2

  # Cupertino Icons字体。与CupertinoIcons类一起用于iOS样式图标。
  cupertino_icons: ^1.0.8
  # image
  image: ^4.3.0
  # 路径
  path: ^1.9.0
  # 文件/文件夹选择器（Windows桌面）
  file_selector: ^1.0.3
  # 桌面拖拽接收
  desktop_drop: ^0.5.0
  # 窗口管理与状态记忆
  window_manager: ^0.5.2
  # FFI 工具（Utf16 分配等）
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 下面的"flutter_lints"包包含一组推荐的lints鼓励良好的编码实践
  # 包提供的检测集是在"analysis_options.yaml"中激活。在根目录下的文件包中。有关停用特定lint的信息，请参阅该文件规则和激活额外的规则。
  flutter_lints: ^5.0.0

# 有关此文件的通用Dart部分的信息，请参见: https://dart.dev/tools/pub/pubspec

# 以下部分是针对Flutter包的
flutter:

  # 下面一行确保Material Icons字体为包含在您的应用程序中，以便您可以使用材质图标类。
  uses-material-design: true

  # 图像资源可以引用一个或多个特定于分辨率的“变体”，请参阅：https://flutter.dev/to/resolution-aware-images

  # 有关从包依赖项中添加资产的详细信息，请参见：https://flutter.dev/to/asset-from-package

  # 若要向应用程序添加自定义字体，请在此处添加字体部分，在这个"flutter"部分。
  # 这个列表中的每个条目都应该有一个"family"键带有字体族名称，"fonts"键带有给出资源和其他字体描述符的列表，如下例子:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 有关包依赖项中的字体的详细信息，请参见：https://flutter.dev/to/font-from-package
