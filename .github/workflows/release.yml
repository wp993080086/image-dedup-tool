name: Release Windows

# 推送 v 开头的语义化版本标签（如 v1.0.0、v1.2.3、v1.0.0-beta.1）时触发：构建 Windows 包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Windows Release
        run: flutter build windows --release

      - name: 打包产物
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath image-dedup-windows.zip

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: image-dedup-windows.zip
          generate_release_notes: true
